name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: OpenAPI document and generated client are up to date
        run: pnpm --filter @beans/contracts openapi:check
      - run: pnpm build

  integration:
    name: Integration tests and migrations (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beans
          POSTGRES_PASSWORD: beans
          POSTGRES_DB: beans_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beans -d beans_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://beans:beans@localhost:5432/beans_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No destructive migration without a named approval
        run: pnpm --filter @beans/api db:check-migrations
      - name: Apply migrations to an empty database
        run: pnpm db:migrate
      - name: Schema matches migrations (no drift)
        working-directory: apps/api
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed synthetic data twice (must be repeatable)
        run: pnpm db:seed && pnpm db:seed
      - run: pnpm test:integration

  e2e:
    name: Browser tests (customer app, portal, tablet, admin console)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beans
          POSTGRES_PASSWORD: beans
          POSTGRES_DB: beans_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beans -d beans_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Fictional seed data and the fake payment provider only. Development sign-in is refused
      # by the API with NODE_ENV=production, so it can never reach a real deployment. NODE_ENV
      # is left unset: the API defaults to development and Next.js builds need their own value.
      DATABASE_URL: postgresql://beans:beans@localhost:5432/beans_e2e
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002,http://localhost:8081
      DEV_AUTH_ENABLED: "true"
      RATE_LIMIT_ENABLED: "false"
      NEXT_PUBLIC_DEV_AUTH: "true"
      NEXT_PUBLIC_API_URL: http://localhost:3000
      EXPO_PUBLIC_DEV_AUTH: "true"
      EXPO_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Per-run signing secrets (random, never stored)
        run: |
          echo "PAYMENT_WEBHOOK_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PICKUP_CODE_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "TABLE_TOKEN_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "FILE_SIGNING_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - name: Customer app web build (for browser tests)
        run: pnpm --filter @beans/mobile export:web
      - name: Install the browser
        run: pnpm --filter @beans/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/report
          retention-days: 7

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      # No dependency cache here: this job audits the lockfile and never installs, so a
      # cache step would fail its post-job save with "path does not exist".
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fail on high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high
